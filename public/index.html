    <!-- Fontes: Geist (UI) e Geist Mono (IDs, contadores, meta) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Ícone da aba: ponto verde "ao vivo" -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1113'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%234fd18b'/%3E%3C/svg%3E">

    <!-- Leaflet 1.9.4 e Leaflet.markercluster 1.5.3 servidos pelo próprio site
         (public/vendor/): alguns visitantes não alcançam o unpkg.com -->
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <!-- Só o CSS base do cluster; o visual dos clusters é nosso -->
    <link rel="stylesheet" href="vendor/leaflet.markercluster/MarkerCluster.css" />

    <style>
        :root {
            --bg: #0f1113;
            --surface: #1b1e22;
            --surface-2: #16191c;
            --line: #2c3036;
            --line-2: #363b42;
            --text: #f1f3f5;
            --muted: #a4aab2;
            --muted-2: #8f959d;
            --live: #4fd18b;
            --off: #7b8088;
            --brt: #5a95e6;
            --link: #9fe3bd;
            --link-hover: #d4f5e2;
            --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        html {
            background: var(--bg);
        }

        body {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: Geist, system-ui, -apple-system, 'Segoe UI', sans-serif;
            font-size: 14px;
        }

        a {
            color: var(--link);
            text-decoration: none;
        }

        a:hover {
            color: var(--link-hover);
        }

        button {
            font: inherit;
        }

        .mono {
            font-family: var(--mono);
        }

        /* Ícones SVG de traço (herdam a cor do texto) */
        .ic {
            flex: none;
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes rcPulse {
            0% { box-shadow: 0 0 0 0 rgba(79, 209, 139, 0.6); }
            70% { box-shadow: 0 0 0 7px rgba(79, 209, 139, 0); }
            100% { box-shadow: 0 0 0 0 rgba(79, 209, 139, 0); }
        }

        .live-dot {
            display: inline-block;
            flex: none;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--live);
            animation: rcPulse 1.8s infinite;
        }

        /* ---------------- Header ---------------- */
        .rc-header {
            position: relative;
            z-index: 1100;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--line);
            background: var(--bg);
        }

        .brand {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
        }

        .brand-name {
            font-weight: 700;
            font-size: 16px;
            letter-spacing: -0.01em;
        }

        .brand-count {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
        }

        .status-pills {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        .pill-live {
            background: rgba(79, 209, 139, 0.12);
            color: #a6e6c0;
        }

        .pill-off {
            background: var(--line);
            color: #b4b9c0;
        }

        .off-dot {
            flex: none;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--off);
        }

        .search {
            position: relative;
            flex: 1 1 300px;
            max-width: 520px;
            margin-left: auto;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 40px;
            padding: 0 12px;
            border-radius: 10px;
            background: var(--surface);
            border: 1px solid #30353b;
        }

        .search-box:focus-within {
            border-color: #4a5058;
        }

        .search-icon {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--muted-2);
        }

        .search-box input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: 0;
            outline: none;
            color: var(--text);
            font: inherit;
            font-size: 14px;
        }

        .search-box input::placeholder {
            color: #7d838b;
        }

        .search-box input::-webkit-search-cancel-button {
            display: none;
        }

        .kbd {
            font-family: var(--mono);
            font-size: 11px;
            color: #7d838b;
            padding: 2px 6px;
            border: 1px solid var(--line-2);
            border-radius: 5px;
        }

        .search-dropdown {
            position: absolute;
            top: 46px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: min(70vh, 460px);
            overflow-y: auto;
            padding: 8px;
            background: var(--surface);
            border: 1px solid #30353b;
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        }

        .sd-label {
            padding: 4px 6px 0;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted-2);
        }

        .sd-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 4px;
        }

        .sd-chip {
            padding: 5px 10px;
            border-radius: 999px;
            border: 1px solid var(--line-2);
            background: #23262b;
            color: #e6e9ec;
            font-size: 12px;
            cursor: pointer;
        }

        .sd-chip:hover {
            background: #2f3338;
        }

        .sd-rows {
            display: flex;
            flex-direction: column;
        }

        .sd-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 6px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: inherit;
            text-align: left;
            cursor: pointer;
        }

        .sd-row:hover {
            background: #26292e;
        }

        .sd-dot {
            flex: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* Nome + bairro lado a lado (no mobile, um embaixo do outro) */
        .sd-text {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sd-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sd-bairro {
            flex: none;
            font-family: var(--mono);
            font-size: 11px;
            color: #8a9098;
        }

        .sd-empty {
            padding: 8px 6px;
            font-size: 13px;
            color: var(--muted-2);
        }

        .github-link {
            display: flex;
            align-items: center;
            height: 40px;
            padding: 0 14px;
            border-radius: 10px;
            border: 1px solid #30353b;
            color: #d0d4d9;
            font-size: 13px;
            font-weight: 500;
        }

        .github-link:hover {
            color: var(--text);
            border-color: #3a3f46;
        }

        /* ---------------- Corpo: mapa + fixadas ---------------- */
        .rc-body {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        .map-wrap {
            position: relative;
            flex: 1;
            min-width: 0;
            isolation: isolate;
        }

        #map {
            position: absolute;
            inset: 0;
        }

        .leaflet-container {
            background: var(--bg);
            font-family: Geist, system-ui, sans-serif;
        }

        .leaflet-control-attribution {
            background: rgba(15, 17, 19, 0.7) !important;
            color: #8a9098 !important;
            font-size: 10px !important;
        }

        .leaflet-control-attribution a {
            color: #8a9098;
        }

        .leaflet-bar {
            border: 1px solid var(--line) !important;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3) !important;
        }

        .leaflet-bar a {
            background: var(--surface) !important;
            color: #e9ecef !important;
            border-color: var(--line) !important;
        }

        .leaflet-bar a:hover {
            background: #26292e !important;
        }

        /* Clusters de câmeras próximas (Leaflet.markercluster) */
        .rc-cluster {
            background: transparent;
            border: 0;
        }

        /* Anel = proporção de cada cor de ponto; o fundo vem inline (conic-gradient) */
        .cl {
            width: 100%;
            height: 100%;
            padding: 2.5px;
            border-radius: 50%;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s ease;
        }

        .cl > span {
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--surface);
            color: #eef0f2;
            font-family: var(--mono);
            font-size: 10.5px;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        .rc-cluster:hover .cl {
            transform: scale(1.08);
        }

        /* Carregamento inicial (e erro, com "Tentar novamente") */
        .loading {
            position: absolute;
            inset: 0;
            z-index: 950;
            display: grid;
            place-items: center;
            padding: 16px;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .loading.is-done {
            opacity: 0;
        }

        .loading-card {
            pointer-events: auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 12px;
            min-width: 280px;
            max-width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--line-2);
            background: rgba(22, 25, 28, 0.92);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        }

        .loading-spinner {
            flex: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--line-2);
            border-top-color: var(--live);
            animation: rcSpin 0.8s linear infinite;
        }

        @keyframes rcSpin {
            to { transform: rotate(360deg); }
        }

        .loading-error-icon {
            display: none;
            flex: none;
            place-items: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255, 155, 143, 0.14);
            color: #ff9b8f;
            font-size: 13px;
            font-weight: 700;
        }

        .loading-text {
            flex: 1 1 180px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .loading-title {
            font-size: 13px;
            font-weight: 600;
        }

        .loading-step {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
        }

        .loading-card .loading-retry {
            display: none;
            flex: none;
        }

        .loading.is-error .loading-spinner {
            display: none;
        }

        .loading.is-error .loading-error-icon {
            display: grid;
        }

        .loading.is-error .loading-retry {
            display: inline-flex;
        }

        @media (prefers-reduced-motion: reduce) {
            .loading-spinner {
                animation-duration: 2.4s;
            }
        }

        /* Filtros flutuantes sobre o mapa */
        .filter-chips {
            position: absolute;
            left: 12px;
            top: 12px;
            z-index: 900;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-width: calc(100% - 24px);
        }

        .chip {
            position: relative;
            display: flex;
            align-items: center;
            gap: 7px;
            height: 32px;
            padding: 0 12px;
            border-radius: 999px;
            border: 1px solid #3a3f46;
            background: rgba(27, 30, 34, 0.92);
            color: #eef0f2;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        }

        .chip-swatch {
            flex: none;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--swatch);
            border: 2px solid var(--ring);
        }

        .chip-label {
            white-space: nowrap;
        }

        .chip-count {
            font-family: var(--mono);
            font-size: 11px;
            opacity: 0.7;
        }

        .chip[aria-pressed="false"] {
            background: rgba(15, 17, 19, 0.7);
            border-color: #2a2e33;
            color: #7d838b;
        }

        .chip[aria-pressed="false"] .chip-swatch {
            background: transparent;
            border-color: #5a6068;
        }

        /* "Ao vivo": duas bolinhas sobrepostas (verde + azul) = os dois tipos no ar */
        .chip-duo {
            flex: none;
            display: flex;
        }

        .chip-duo i {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--c);
            border: 2px solid var(--c);
        }

        .chip-duo i + i {
            margin-left: -2px;
            box-shadow: 0 0 0 1.5px #1b1e22; /* separa da primeira */
        }

        .chip[aria-pressed="false"] .chip-duo i {
            background: transparent;
            border-color: #5a6068;
            box-shadow: none;
        }

        /* Feed de vídeo (popup, card fixado e painel do mobile) */
        .feed {
            position: relative;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            background: repeating-linear-gradient(135deg, #1d2024 0 10px, #222529 10px 20px);
        }

        .feed.is-playing {
            background: #000;
        }

        .feed video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .feed-status {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--muted-2);
            pointer-events: none;
        }

        .feed-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: var(--text);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
        }

        .feed-badge.off {
            color: #b4b9c0;
        }

        .feed-note {
            position: absolute;
            bottom: 8px;
            right: 10px;
            z-index: 2;
            font-family: var(--mono);
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
        }

        .feed.is-playing .feed-status,
        .feed.is-playing .feed-note {
            display: none;
        }

        .feed .loading-bar {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 3;
            width: 0;
            height: 3px;
            background: var(--live);
            transition: width 0.2s ease-out;
        }

        .feed-error {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 36px 16px 12px;
            text-align: center;
        }

        .feed-error-msg {
            font-size: 13px;
            font-weight: 600;
            color: #ff9b8f;
            text-wrap: pretty;
        }

        .feed-error-hint {
            font-size: 12px;
            color: var(--muted);
        }

        .feed-error-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-small {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 32px;
            padding: 0 12px;
            border-radius: 8px;
            border: 1px solid var(--line-2);
            background: var(--surface);
            color: #e6e9ec;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-small:hover {
            background: #26292e;
            color: var(--text);
        }

        /* Linha "#id · bairro · tipo" */
        .meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 8px;
            font-family: var(--mono);
            font-size: 11px;
            color: #959ba3;
        }

        /* Popup da câmera (desktop), ancorado ao marcador */
        .cam-popup {
            position: absolute;
            z-index: 1000;
            width: 420px;
            max-width: calc(100% - 24px);
            max-height: calc(100% - 24px);
            overflow: auto;
            background: var(--surface-2);
            border: 1px solid var(--line-2);
            border-radius: 14px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        }

        .cp-head {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 12px 10px 14px;
        }

        .cp-headtext,
        .m-headtext {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cp-title {
            font-weight: 600;
            font-size: 15px;
            line-height: 1.3;
            text-wrap: pretty;
        }

        .cp-close {
            flex: none;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 0;
            background: var(--line);
            color: #d0d4d9;
            font-size: 16px;
            cursor: pointer;
        }

        .cp-close:hover,
        .m-close:hover,
        .pin-x:hover {
            background: var(--line-2);
            color: var(--text);
        }

        .cp-feed {
            margin: 0 10px;
        }

        .cp-actions {
            display: flex;
            gap: 8px;
            padding: 10px;
        }

        .btn-primary {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 38px;
            border-radius: 9px;
            border: 0;
            background: var(--live);
            color: var(--bg);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: #66da9c;
        }

        .btn-secondary {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 38px;
            border-radius: 9px;
            border: 1px solid var(--line-2);
            color: #e6e9ec;
            font-size: 13px;
            font-weight: 500;
        }

        .btn-secondary:hover {
            background: #1f2327;
            color: var(--text);
        }

        /* Painel de câmeras fixadas (desktop) */
        .pin-panel {
            flex: none;
            width: 380px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            border-left: 1px solid var(--line);
            background: var(--bg);
        }

        .pin-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
        }

        .pin-title {
            font-weight: 600;
            font-size: 14px;
        }

        .pin-count {
            padding: 2px 7px;
            border-radius: 999px;
            background: var(--line);
            color: #c9cdd2;
            font-family: var(--mono);
            font-size: 11px;
        }

        .pin-cols {
            display: grid;
            place-items: center;
            width: 26px;
            height: 26px;
            margin-left: auto;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: #9ea4ab;
            cursor: pointer;
        }

        .pin-cols:hover,
        .pin-cols[aria-pressed="true"] {
            background: var(--line);
            color: #f0f2f4;
        }

        .pin-clear {
            border: 0;
            background: transparent;
            color: #9ea4ab;
            font-size: 12px;
            cursor: pointer;
        }

        .pin-clear:hover {
            color: #f0f2f4;
        }

        .pin-list {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-auto-rows: max-content;
            align-content: start;
            gap: 12px;
            padding: 12px;
        }

        .pin-list.cols-2 {
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }

        .pin-card {
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--line);
        }

        .pin-card.is-flash {
            animation: pinFlash 1.2s ease-out;
        }

        @keyframes pinFlash {
            from { border-color: var(--live); box-shadow: 0 0 0 2px rgba(79, 209, 139, 0.45); }
            to { border-color: var(--line); box-shadow: 0 0 0 2px rgba(79, 209, 139, 0); }
        }

        .pin-card .feed {
            flex: none;
            border-radius: 0;
        }

        .pin-card .feed-badge {
            top: 8px;
            left: 8px;
            gap: 5px;
            padding: 3px 7px;
            border-radius: 5px;
            font-size: 10px;
        }

        .pin-card .feed-note {
            display: none;
        }

        /* Em 2 colunas o feed tem ~95px de altura: erro compacto */
        .pin-list.cols-2 .feed-error {
            gap: 4px;
            padding: 26px 8px 6px;
        }

        .pin-list.cols-2 .feed-error-msg {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-size: 11px;
            line-height: 1.25;
        }

        .pin-list.cols-2 .feed-error-hint {
            display: none;
        }

        .pin-list.cols-2 .feed-error-actions {
            margin-top: 0;
        }

        .pin-list.cols-2 .feed-error-actions a {
            display: none;
        }

        .pin-list.cols-2 .btn-small {
            height: 26px;
            padding: 0 8px;
            font-size: 11px;
        }

        .pin-foot {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 10px 10px 12px;
        }

        .pin-name {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 0;
            border: 0;
            background: transparent;
            color: inherit;
            text-align: left;
            cursor: pointer;
        }

        .pin-name-t {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 500;
        }

        .pin-name:hover .pin-name-t {
            color: var(--link-hover);
        }

        .pin-meta {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted-2);
        }

        .pin-x {
            flex: none;
            width: 28px;
            height: 28px;
            border-radius: 7px;
            border: 0;
            background: var(--line);
            color: #c9cdd2;
            cursor: pointer;
        }

        .pin-empty {
            grid-column: 1 / -1;
            padding: 28px 16px;
            border: 1px dashed var(--line-2);
            border-radius: 12px;
            color: #9ea4ab;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
            text-wrap: pretty;
        }

        /* Painel da câmera no mobile (tela dividida). A altura segue o conteúdo
           (vídeo em 16:9), com teto para celulares baixos/deitados. */
        .m-panel {
            position: relative;
            z-index: 1000;
            flex: none;
            max-height: 60vh;
            max-height: 60dvh;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: -14px;
            padding: 14px 14px 16px;
            border-top: 1px solid #30353b;
            border-radius: 18px 18px 0 0;
            background: var(--surface-2);
            box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.45);
        }

        .m-head {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .m-title {
            font-weight: 600;
            font-size: 16px;
            line-height: 1.3;
            text-wrap: pretty;
        }

        .m-actions {
            flex: none;
            display: flex;
            gap: 8px;
        }

        .m-close,
        .m-open {
            flex: none;
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 0;
            background: var(--line);
            color: #e0e3e6;
            font-size: 20px;
            cursor: pointer;
        }

        /* "Abrir em tela cheia": ação principal, em verde */
        .m-open {
            background: rgba(79, 209, 139, 0.14);
            color: #a6e6c0;
        }

        .m-open:hover {
            color: #d4f5e2;
        }

        .m-open .ic {
            width: 18px;
            height: 18px;
        }

        /* Vídeo em 16:9 (sem tarjas); encolhe se o painel bater no teto */
        .m-feed {
            flex: 0 1 auto;
            min-height: 0;
            border-radius: 12px;
        }

        .m-hint {
            flex: none;
            padding: 14px 16px;
            border-top: 1px solid var(--line);
            background: var(--surface-2);
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        /* Banner global quando o servidor de vídeo do COR está fora do ar */
        .server-banner {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1500;
            padding: 11px 44px;
            background: #5c1a1a;
            border-bottom: 1px solid #7a2a2a;
            color: #ffe4e0;
            font-size: 13px;
            line-height: 1.35;
            text-align: center;
        }

        .server-banner button.close {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            padding: 4px 8px;
            border: none;
            background: none;
            color: #ffe4e0;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
        }

        @media (min-width: 760px) {
            .m-panel,
            .m-hint {
                display: none !important;
            }
        }

        @media (max-width: 759px) {
            .status-pills,
            .github-link,
            .pin-panel {
                display: none !important;
            }

            /* Logo e busca na mesma linha */
            .rc-header {
                flex-wrap: nowrap;
            }

            .brand {
                flex: none;
            }

            /* position: static -> a lista de resultados se ancora no header (largura toda) */
            .search {
                position: static;
                flex: 1 1 auto;
                min-width: 0;
                max-width: none;
                margin-left: 0;
            }

            /* 16px evita o zoom automático do iOS ao focar o campo */
            .search-box input {
                font-size: 16px;
            }

            .kbd {
                display: none;
            }

            .search-dropdown {
                top: calc(100% - 6px);
                left: 8px;
                right: 8px;
            }

            /* Chips numa linha só, com rolagem horizontal se não couberem */
            .filter-chips {
                left: 0;
                right: 0;
                top: 6px;
                max-width: none;
                flex-wrap: nowrap;
                overflow-x: auto;
                padding: 4px 12px 10px; /* folga p/ a sombra e o alvo de toque */
                scrollbar-width: none;
                touch-action: pan-x;
            }

            .filter-chips::-webkit-scrollbar {
                display: none;
            }

            .chip {
                flex: none;
            }

            /* Resultados da busca: bairro embaixo do nome, que fica com a largura toda */
            .sd-text {
                flex-direction: column;
                align-items: stretch;
                gap: 2px;
            }

            .sd-name {
                flex: none;
            }

            /* Alvo de toque maior que o chip, sem sobrepor o vizinho */
            .chip::after {
                content: '';
                position: absolute;
                inset: -3px;
            }

            /* Controles do mapa acima da borda que o painel sobrepõe */
            body.has-selection .leaflet-bottom {
                bottom: 14px;
            }

            .server-banner {
                font-size: 12px;
                padding: 9px 40px;
            }
        }
    </style>
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MP4339CX" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <header class="rc-header">
        <div class="brand">
            <div class="brand-name">RioCameras.com</div>
            <div class="brand-count" id="camera-count">Carregando…</div>
        </div>

        <div class="status-pills" id="status-pills" hidden>
            <div class="pill pill-live"><span class="live-dot"></span><span id="pill-live"></span></div>
            <div class="pill pill-off"><span class="off-dot"></span><span id="pill-off"></span></div>
        </div>

        <div class="search" id="search">
            <div class="search-box">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input id="search-input" type="search" placeholder="Buscar rua, câmera ou bairro" autocomplete="off"
                    spellcheck="false" aria-label="Buscar rua, câmera ou bairro">
                <span class="kbd" aria-hidden="true">/</span>
            </div>
            <div class="search-dropdown" id="search-dropdown" hidden></div>
        </div>

        <a href="https://github.com/rbravo/riocameras" target="_blank" rel="noopener" class="github-link">GitHub</a>
    </header>

    <div class="rc-body">
        <div class="map-wrap" id="map-wrap">
            <div id="map"></div>
            <div class="filter-chips" id="filter-chips"></div>
            <div class="cam-popup" id="cam-popup" hidden></div>
            <div id="loading" class="loading" role="status" aria-live="polite">
                <div class="loading-card">
                    <div class="loading-spinner" aria-hidden="true"></div>
                    <div class="loading-error-icon" aria-hidden="true">!</div>
                    <div class="loading-text">
                        <div class="loading-title" id="loading-title">Carregando câmeras</div>
                        <div class="loading-step" id="loading-step">Buscando a lista de câmeras…</div>
                    </div>
                    <button type="button" class="btn-small loading-retry" id="loading-retry">Tentar novamente</button>
                </div>
            </div>
        </div>

        <!-- Câmeras fixadas (somente desktop) -->
        <aside class="pin-panel" id="pin-panel">
            <div class="pin-header">
                <div class="pin-title">Fixadas</div>
                <div class="pin-count" id="pin-count">0</div>
                <button type="button" class="pin-cols" id="pin-cols" aria-pressed="false" title="Mostrar em 2 colunas">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
                        <rect x="1" y="1" width="5" height="5" rx="1" />
                        <rect x="8" y="1" width="5" height="5" rx="1" />
                        <rect x="1" y="8" width="5" height="5" rx="1" />
                        <rect x="8" y="8" width="5" height="5" rx="1" />
                    </svg>
                </button>
                <button type="button" class="pin-clear" id="pin-clear">Limpar</button>
            </div>
            <div class="pin-list" id="pin-list">
                <div class="pin-empty" id="pin-empty">Clique numa câmera no mapa e use “Fixar” para acompanhá-la aqui.</div>
            </div>
        </aside>
    </div>

    <!-- Câmera selecionada no mobile (tela dividida) -->
    <section class="m-panel" id="m-panel" hidden></section>
    <div class="m-hint" id="m-hint" hidden>Toque numa câmera no mapa para assistir</div>

    <!-- Leaflet JS -->
    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="vendor/leaflet.markercluster/leaflet.markercluster.js"></script>

    <script>
        // ============================================================
        //  Utilidades
        // ============================================================
        const MOBILE_MQ = window.matchMedia('(max-width: 759px)');
        const isMobileUi = () => MOBILE_MQ.matches;

        const fmt = (n) => n.toLocaleString('pt-BR');
        const esc = (s) => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        // Busca sem acento e sem diferenciar maiúsculas ("marco" acha "MARÇO")
        const norm = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

        // localStorage pode estar bloqueado (aba anônima etc.): falha em silêncio
        const storage = {
            get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
            set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
        };

        // Ícones SVG de traço (estilo em .ic)
        const ICON = {
            check: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
            external: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>',
            expand: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/></svg>'
        };

        // Cores dos marcadores e legendas
        const COLOR ={ online: '#4fd18b', offline: '#7b8088', unknown: '#f2c94c', brt: '#5a95e6', bg: '#0f1113' };

        // Cor do ponto: fora do ar = cinza e não verificada = amarelo (qualquer
        // tipo); no ar, BRT = azul e as demais = verde.
        function markerColor(entry) {
            if (entry.status === 'online') return entry.cam.brt ? COLOR.brt : COLOR.online;
            return COLOR[entry.status];
        }

        const mapWrap = document.getElementById('map-wrap');
        const popupEl = document.getElementById('cam-popup');
        const mPanel = document.getElementById('m-panel');
        const mHint = document.getElementById('m-hint');

        // Objeto para armazenar os timeouts de cada player individualmente
        const cameraTimeouts = {};

        // Banner global para quando o servidor de vídeo do COR está inacessível
        // (ex.: certificado TLS expirado, servidor fora do ar). Mostra uma vez.
        let serverDownShown = false;
        function showServerDownBanner() {
            if (serverDownShown) return;
            serverDownShown = true;
            const bar = document.createElement('div');
            bar.className = 'server-banner';
            bar.innerHTML =
                '⚠️ As câmeras do COR estão temporariamente fora do ar ' +
                '(problema no servidor de vídeo da prefeitura, não no site). Tente novamente mais tarde.' +
                '<button class="close" title="Fechar" aria-label="Fechar">×</button>';
            bar.querySelector('.close').addEventListener('click', () => bar.remove());
            mapWrap.appendChild(bar);
        }

        // Testa se o servidor de vídeo responde; se não, mostra o banner. Tenta de
        // novo antes (rede de celular às vezes falha só na primeira conexão).
        function probeStreamServer(retries = 1) {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), 8000);
            fetch(STREAM_ORIGIN + '/', { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal })
                .then(() => clearTimeout(t))
                .catch(() => {
                    clearTimeout(t);
                    if (retries > 0) setTimeout(() => probeStreamServer(retries - 1), 3000);
                    else showServerDownBanner();
                });
        }

        function startLoadingBar(key) {
            const bar = document.getElementById(`loading-bar-${key}`);
            if (!bar) return;

            // Chega a 100% em 20s (só um indicativo de progresso)
            bar.style.transition = "width 20s linear";
            requestAnimationFrame(() => {
                bar.style.width = "100%";
            });
        }

        function finishLoadingBar(key) {
            const bar = document.getElementById(`loading-bar-${key}`);
            if (!bar) return;

            bar.style.transition = "all 0.3s ease-out";
            bar.style.width = "100%";
            // depois some suavemente
            setTimeout(() => {
                if (bar) bar.style.opacity = "0";
            }, 400);
            setTimeout(() => {
                if (bar && bar.parentNode) bar.remove();
            }, 800);
        }

        function clearCameraTimeouts(key) {
            if (cameraTimeouts[key]) {
                if (cameraTimeouts[key].timeout1) {
                    clearTimeout(cameraTimeouts[key].timeout1);
                }
                if (cameraTimeouts[key].timeout2) {
                    clearTimeout(cameraTimeouts[key].timeout2);
                }
                delete cameraTimeouts[key];
            }
        }

        // ============================================================
        //  Mapa (Leaflet, tema escuro, marcadores em canvas)
        // ============================================================
        const map = L.map('map', {
            zoomControl: false,
            preferCanvas: true,
            minZoom: 10, // a cidade inteira; menos níveis para o cluster calcular
            maxZoom: 16, // último nível dos tiles da Esri (acima disso ficariam borrados)
            // Área de clique um pouco maior que o círculo (no toque precisa de folga)
            renderer: L.canvas({ padding: 0.5, tolerance: window.matchMedia('(pointer: coarse)').matches ? 10 : 3 })
        }).setView([-22.9997404, -43.3659929], 14);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Esri Dark Gray (não precisa de chave). Os tiles vão até o zoom 16.
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors',
            maxZoom: 16
        }).addTo(map);

        // Padrão: 6px com borda escura; selecionado: 10px com borda branca
        function markerStyle(entry, isSelected) {
            const fill = { fillColor: markerColor(entry), fillOpacity: entry.status === 'offline' ? 0.8 : 0.95 };
            if (isSelected) return { radius: 10, color: '#ffffff', weight: 3, ...fill };
            return { radius: 6, color: COLOR.bg, weight: 1, ...fill };
        }

        // Agrupa câmeras muito próximas. O raio (px) diminui com o zoom: de longe
        // limpa o mapa; de perto só junta pontos que se encostam. No zoom máximo o
        // clique no cluster abre as câmeras em leque (ex.: várias no mesmo poste).
        // Pernas do leque num pane próprio, abaixo dos pontos e sem capturar
        // cliques (a ponta da perna fica bem em cima da câmera)
        map.createPane('spiderLegs');
        map.getPane('spiderLegs').style.zIndex = 390;
        map.getPane('spiderLegs').style.pointerEvents = 'none';

        const clusters = L.markerClusterGroup({
            // No 16 (zoom máximo) só junta pontos que se sobrepõem de fato
            maxClusterRadius: (zoom) => zoom >= 16 ? 16 : zoom === 15 ? 22 : zoom === 14 ? 28 : zoom >= 12 ? 36 : 56,
            showCoverageOnHover: false,
            spiderfyDistanceMultiplier: 1.3,
            // As pernas são animadas via SVG (o resto do mapa é canvas)
            spiderLegPolylineOptions: {
                renderer: L.svg({ pane: 'spiderLegs' }), pane: 'spiderLegs', interactive: false,
                weight: 1.5, color: '#a4aab2', opacity: 0.6
            },
            iconCreateFunction: clusterIcon
        }).addTo(map);
        // No leque a câmera muda de posição: o popup acompanha
        clusters.on('spiderfied unspiderfied', positionPopup);

        // Contagem no centro; anel com a proporção de cada cor de ponto
        // (verde, azul do BRT, cinza fora do ar, amarelo não verificada).
        function clusterIcon(cluster) {
            const kids = cluster.getAllChildMarkers();
            const n = kids.length;
            let live = 0, liveBrt = 0, off = 0;
            kids.forEach(m => {
                const e = m.entry;
                if (e.status === 'online') { if (e.cam.brt) liveBrt++; else live++; }
                else if (e.status === 'offline') off++;
            });
            const a = (live / n) * 100, b = ((live + liveBrt) / n) * 100, c = ((live + liveBrt + off) / n) * 100;
            const size = n < 10 ? 22 : n < 100 ? 28 : n < 1000 ? 34 : 40;
            return L.divIcon({
                className: 'rc-cluster',
                html: `<div class="cl" style="background:conic-gradient(${COLOR.online} 0 ${a}%, ${COLOR.brt} ${a}% ${b}%, ${COLOR.offline} ${b}% ${c}%, ${COLOR.unknown} ${c}% 100%)"><span>${fmt(n)}</span></div>`,
                iconSize: [size, size]
            });
        }

        // Bairros (busca + bairro aproximado de cada câmera). O build troca o
        // fetch abaixo pelos dados embutidos de bairros-data.js.
        let resolveBairros;
        const bairrosReady = new Promise(resolve => { resolveBairros = resolve; });
        // Buscar dados dos bairros
        fetch('/api/bairros')
            .then(response => response.json())
            .then(bairros => {
                resolveBairros(bairros);
            })
            .catch(error => {
                console.error('Erro ao carregar bairros:', error);
                resolveBairros([]);
            });

        // O cameras.json não traz bairro: usamos o centro de bairro mais próximo
        // (aproximação; perto das divisas pode indicar o bairro vizinho).
        function nearestBairro(lat, lon, list) {
            let best = null, bestD = Infinity;
            const k = Math.cos(lat * Math.PI / 180);
            for (const b of list) {
                const dy = lat - b.lat, dx = (lon - b.lon) * k;
                const d = dx * dx + dy * dy;
                if (d < bestD) { bestD = d; best = b; }
            }
            return best ? best.nome : '';
        }

        // ============================================================
        //  Feed de câmeras (COR.Rio) — player WebRTC (WHEP) via proxy
        // ------------------------------------------------------------
        //  Lista:   GET https://appcor.cor-rio.work/api/cameras/?limit=0
        //           -> [{ cameraId, apiId, nome, lat, lon, ... }]  (sem token)
        //  O vídeo é WebRTC. Fluxo do player oficial (apiId = "000001"):
        //    POST /api/camera/player/session/start/{apiId}/  {}    -> { sessionId }
        //    POST /api/camera/player/whep/{sessionId}/  (SDP offer) -> SDP answer
        //         (o header Link do WHEP traz os ICE servers/TURN a usar)
        //    POST /api/camera/player/session/heartbeat/ {sessionId} (a cada 20s)
        //    POST /api/camera/player/session/stop/      {sessionId} (ao fechar)
        //  Essa sinalização exige header Origin same-origin e não libera CORS,
        //  então passa toda pelo proxy (SIGNAL_BASE), que injeta o Origin. A
        //  mídia conecta direto nos servidores do COR via ICE/TURN.
        //  OBS: appcor.cor-rio.work/camera/{id}/ manda X-Frame-Options: DENY,
        //  então NÃO dá para usar <iframe>; por isso reimplementamos o player.
        // ============================================================
        // --- Configuração da fonte de dados ---------------------------------
        // O COR mudou a API: não há mais token/streamUrl embutido. O vídeo agora
        // usa uma sessão same-origin (POST .../session/start/{apiId} + WHEP), que o
        // browser não pode chamar direto de outra origem (o COR exige o header
        // Origin e não libera CORS). Por isso TODA a sinalização passa pelo proxy
        // (Worker em produção, server.js em dev), que injeta o Origin e devolve com
        // CORS. A mídia (WebRTC) conecta direto nos servidores do COR via ICE/TURN.
        //
        //  >>> Troque WORKER_BASE pela URL do seu Worker depois de publicá-lo. <<<
        const WORKER_BASE = 'https://rio-cameras-proxy.rafaelbravo.workers.dev';

        // Em dev (localhost) usa o proxy do server.js; em produção usa o Worker.
        const isLocalhost = ['localhost', '127.0.0.1'].includes(location.hostname);
        const CAMERAS_LIST = isLocalhost ? '/api/cameras-live' : (WORKER_BASE + '/');
        // Base da sinalização de vídeo (mesmas rotas no server.js e no Worker).
        const SIGNAL_BASE = isLocalhost ? '' : WORKER_BASE;

        // --- Alternativa (lista estática), se algum dia quiser ---------------
        //   const CAMERAS_LIST = 'cameras.json';  // gerado por `npm run update-cameras`

        // Servidor do COR (usado só no "probe" do banner de fora-do-ar).
        const STREAM_ORIGIN = 'https://appcor.cor-rio.work';

        // Status das câmeras (gerado pelo job em .github/workflows/check-cameras.yml).
        // Marca cada câmera como ao vivo (verde) / fora do ar (cinza) / não checada (azul).
        const STATUS_URL = 'status.json';

        // key -> { pc, sessionId, heartbeat, watchdog }. A key é o cameraId no
        // popup / painel do mobile e "pin-{cameraId}" nas fixadas.
        const activePlayers = {};

        // Encerra a sessão no COR via proxy (sem esperar resposta).
        function stopSession(sessionId) {
            try {
                fetch(SIGNAL_BASE + '/stop', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId }), keepalive: true
                }).catch(() => { });
            } catch (e) { }
        }

        function stopPlayer(key) {
            const p = activePlayers[key];
            if (!p) return;
            // Paramos o heartbeat, zeramos os handlers (p/ fechar sem disparar
            // "conexão perdida") e encerramos a sessão no COR via proxy.
            try { if (p.heartbeat) clearInterval(p.heartbeat); } catch (e) { }
            try { if (p.watchdog) clearTimeout(p.watchdog); } catch (e) { }
            try { if (p.pc) { p.pc.ontrack = null; p.pc.onconnectionstatechange = null; p.pc.close(); } } catch (e) { }
            if (p.sessionId) stopSession(p.sessionId);
            delete activePlayers[key];
        }

        function waitIceGathering(pc, ms = 3000) {
            return new Promise(resolve => {
                if (pc.iceGatheringState === 'complete') return resolve();
                const t = setTimeout(resolve, ms);
                pc.addEventListener('icegatheringstatechange', () => {
                    if (pc.iceGatheringState === 'complete') { clearTimeout(t); resolve(); }
                });
            });
        }

        // Extrai os ICE servers (TURN) do header Link do WHEP (rel="ice-server").
        function parseWhepIceServers(linkHeader) {
            if (!linkHeader) return [];
            const servers = [];
            for (const part of linkHeader.split(/,(?=\s*<)/)) {
                const m = part.match(/<([^>]+)>/);
                if (!m || !/rel\s*=\s*"ice-server"/i.test(part)) continue;
                const s = { urls: m[1] };
                const u = part.match(/username\s*=\s*"([^"]+)"/i);
                const c = part.match(/credential\s*=\s*"([^"]+)"/i);
                if (u) s.username = u[1];
                if (c) s.credential = c[1];
                servers.push(s);
            }
            return servers;
        }

        // Negocia e inicia o stream WebRTC da câmera dentro de videoEl.
        // Fluxo novo do COR (via proxy): session/start -> WHEP. O WHEP devolve,
        // no header Link, os ICE servers (TURN) a usar; como o RTCPeerConnection
        // precisa deles já na criação, fazemos como o player oficial: a 1ª
        // tentativa (STUN) só descobre os ICE servers e, se vierem, reconecta
        // usando-os (uma vez; iceServers != null impede loop).
        async function startCameraStream(key, cam, videoEl, onError, iceServers) {
            const fail = (msg) => { stopPlayer(key); if (onError) onError(msg); };
            let pc, sessionId;
            // O player pode ser fechado no meio da negociação (popup/painel fechado,
            // câmera desafixada), e aí o <video> já saiu da página. Nesse caso
            // desistimos em silêncio, encerrando só o que esta tentativa abriu.
            const abandoned = () => {
                if (videoEl.isConnected) return false;
                const p = activePlayers[key];
                if (p && p.pc === pc) {
                    stopPlayer(key);
                } else {
                    if (pc) { try { pc.ontrack = null; pc.onconnectionstatechange = null; pc.close(); } catch (e) { } }
                    if (sessionId) stopSession(sessionId);
                }
                return true;
            };
            try {
                const sResp = await fetch(SIGNAL_BASE + '/session/start/' + encodeURIComponent(cam.code), {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
                });
                const sData = await sResp.json().catch(() => ({}));
                sessionId = sData.sessionId;
                if (abandoned()) return;
                if (!sResp.ok) return fail(sData.error || 'Falha ao registrar sessão');
                if (!sessionId) return fail('Sessão de vídeo inválida');

                const defaults = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];
                pc = new RTCPeerConnection({ bundlePolicy: 'max-bundle', iceServers: (iceServers && iceServers.length) ? iceServers : defaults });
                pc.addTransceiver('video', { direction: 'recvonly' });
                pc.addTransceiver('audio', { direction: 'recvonly' });
                pc.ontrack = (evt) => { if (evt.streams && evt.streams[0]) videoEl.srcObject = evt.streams[0]; };
                pc.onconnectionstatechange = () => {
                    const st = pc.connectionState;
                    if (st === 'failed' || st === 'disconnected' || st === 'closed') fail('Conexão perdida com a câmera');
                };

                const heartbeat = setInterval(() => {
                    fetch(SIGNAL_BASE + '/heartbeat', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId })
                    }).catch(() => { });
                }, 20000);

                activePlayers[key] = { pc, sessionId, heartbeat };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                await waitIceGathering(pc);
                if (abandoned()) return;

                const wResp = await fetch(SIGNAL_BASE + '/whep/' + encodeURIComponent(sessionId), {
                    method: 'POST', headers: { 'Content-Type': 'application/sdp' },
                    body: pc.localDescription.sdp
                });
                const answerSdp = await wResp.text();
                if (abandoned()) return;
                if (!wResp.ok) {
                    let msg = 'Câmera sem sinal ou offline';
                    try { const j = JSON.parse(answerSdp); if (j.error) msg = j.error; } catch (e) { }
                    return fail(msg);
                }

                // Descoberta dos ICE servers (TURN) e reconexão (1x) com eles.
                if (!iceServers || !iceServers.length) {
                    const discovered = parseWhepIceServers(wResp.headers.get('Link'));
                    if (discovered.length) {
                        stopPlayer(key); // handlers já zerados; não dispara erro
                        return startCameraStream(key, cam, videoEl, onError, discovered);
                    }
                }

                await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
                if (abandoned()) return;

                // Watchdog: a negociação pode dar OK mas a câmera estar offline
                // (conecta e nunca manda vídeo). Se não chegar frame em ~20s,
                // avisa que está sem sinal em vez de ficar em "Conectando…".
                let gotFrames = false;
                const watchdog = setTimeout(() => {
                    if (abandoned()) return;
                    if (!gotFrames && !(videoEl.videoWidth > 0)) {
                        fail('Câmera offline ou sem sinal no momento');
                    }
                }, 20000);
                if (activePlayers[key]) activePlayers[key].watchdog = watchdog;
                videoEl.addEventListener('playing', () => {
                    gotFrames = true;
                    clearTimeout(watchdog);
                }, { once: true });
            } catch (e) {
                if (abandoned()) return; // ex.: pc fechado no meio; não é falha do servidor
                console.error('Erro WHEP:', e);
                if (pc) { try { pc.ontrack = null; pc.onconnectionstatechange = null; pc.close(); } catch (_) { } }
                showServerDownBanner(); // erro de rede ao falar com o proxy/servidor de vídeo
                fail('Servidor de vídeo inacessível');
            }
        }

        // Desde 24/10/2026 o COR manda o apiId sem zeros à esquerda ("1" em vez de
        // "000001"). Padronizamos em 6 dígitos, o formato do status.json e das
        // fixadas salvas. O session/start e a página oficial aceitam os dois.
        const padId = (id) => /^\d+$/.test(id) ? String(id).padStart(6, '0') : (id || '');

        // Normaliza um item da API nova para o formato usado aqui.
        function normalizeCamera(c) {
            const nome = c.nome || 'Câmera';
            return {
                // id = apiId: único campo presente em TODAS as variações da API
                cameraId: padId(c.apiId) || String(c.cameraId || ''),
                code: padId(c.apiId || c.code), // "000001" (usado no session/start)
                nome: nome,
                // Nome sem os sufixos "- BRT" / "- FIXA" (o tipo já aparece na linha de meta)
                titulo: nome.replace(/(\s*-\s*(BRT|FIXA)\s*)+$/i, '').trim() || nome,
                // Câmeras do BRT têm "- BRT" no nome (ex.: "BOSQUE DA BARRA - BRT - FIXA")
                brt: /-\s*BRT\b/i.test(nome),
                fixa: /\bFIXA\b/i.test(nome),
                lat: parseFloat(c.lat),
                lon: parseFloat(c.lon),
                // página oficial (abre como aba top-level; não serve p/ iframe).
                // A URL usa o apiId (CODE), NÃO o cameraId — é assim que o app faz.
                pageUrl: 'https://appcor.cor-rio.work/camera/' + String(c.apiId || c.code || '').replace(/\D+/g, '') + '/?app=1'
            };
        }

        // "#000123 · Barra da Tijuca · BRT"
        function metaHtml(cam) {
            const tipo = cam.brt ? 'BRT' : (cam.fixa ? 'Fixa' : '');
            return '<div class="meta">' +
                [`#${cam.cameraId}`, cam.bairro, tipo].filter(Boolean).map(esc).map(s => `<span>${s}</span>`).join('<span>·</span>') +
                '</div>';
        }

        function feedBadge(cam) {
            if (cam.status === 'online') return '<div class="feed-badge"><span class="live-dot"></span>AO VIVO</div>';
            if (cam.status === 'offline') return '<div class="feed-badge off">FORA DO AR</div>';
            return '';
        }

        // Monta o player (video + WHEP) dentro do feed #camera-content-{key}. A key
        // é o cameraId no popup / painel do mobile e "pin-{cameraId}" nas fixadas,
        // para os dois poderem tocar a mesma câmera sem conflito de ids nem de sessão.
        //   isStale:      true quando o conteúdo não deve mais ser mostrado
        //   showOpenLink: inclui "Abrir em nova aba" na tela de erro (cards fixados)
        function loadCameraContent(cam, key, { isStale = () => false, showOpenLink = false } = {}) {
            const feed = document.getElementById(`camera-content-${key}`);
            if (!feed) return;
            if (isStale()) return;
            const badge = feedBadge(cam);

            const showError = (message) => {
                if (!feed.isConnected) return;
                if (isStale()) return;
                // O COR recusa a sessão ("codecs not supported by client") quando o
                // navegador não decodifica H.265; aí tentar de novo não adianta.
                const noCodec = /codec/i.test(message);
                const title = noCodec ? 'Este navegador não consegue reproduzir esta câmera' : message;
                const hint = noCodec
                    ? 'Ela transmite em H.265 (HEVC). Tente atualizar o navegador ou usar outro.'
                    : 'Esta câmera pode estar temporariamente fora do ar.';
                feed.classList.remove('is-playing');
                feed.innerHTML = `
                    ${badge}
                    <div class="feed-error">
                        <div class="feed-error-msg">⚠ ${esc(title)}</div>
                        <div class="feed-error-hint">${hint}</div>
                        <div class="feed-error-actions">
                            ${noCodec ? '' : '<button type="button" class="btn-small" data-action="retry">Tentar novamente</button>'}
                            ${showOpenLink ? `<a class="btn-small" href="${cam.pageUrl}" target="_blank" rel="noopener">Abrir em nova aba ${ICON.external}</a>` : ''}
                        </div>
                    </div>
                `;
                const retryBtn = feed.querySelector('[data-action="retry"]');
                if (retryBtn) {
                    retryBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        loadCameraContent(cam, key, { isStale, showOpenLink });
                    });
                }
            };

            feed.classList.remove('is-playing');
            feed.innerHTML = `
                <div class="loading-bar" id="loading-bar-${key}"></div>
                <video id="cam-video-${key}" autoplay muted playsinline></video>
                <div class="feed-status">Conectando…</div>
                ${badge}
                <div class="feed-note">pode levar até 30s para carregar</div>
            `;

            const videoEl = document.getElementById(`cam-video-${key}`);
            if (!videoEl) return;
            videoEl.onplaying = () => {
                feed.classList.add('is-playing');
                finishLoadingBar(key);
            };

            // barrinha de progresso estilo YouTube
            clearCameraTimeouts(key);
            cameraTimeouts[key] = {};
            cameraTimeouts[key].timeout1 = setTimeout(() => startLoadingBar(key), 150);

            stopPlayer(key); // encerra stream anterior deste player (retry)
            startCameraStream(key, cam, videoEl, (msg) => {
                clearCameraTimeouts(key);
                showError(msg);
            });
        }

        // ============================================================
        //  Câmera selecionada: popup (desktop) ou painel inferior (mobile)
        // ============================================================
        const camById = new Map(); // cameraId -> { cam, type, status, marker, key, nameKey }
        let selected = null;

        function selectCamera(entry, { fly = false } = {}) {
            closeSearch();
            if (selected === entry) {
                if (fly) flyToCamera(entry);
                return;
            }
            deselect();
            selected = entry;
            entry.marker.setStyle(markerStyle(entry, true));
            entry.marker.bringToFront();
            if (isMobileUi()) openMobilePanel(entry, fly);
            else openPopup(entry, fly);
        }

        function flyToCamera(entry) {
            map.flyTo([entry.cam.lat, entry.cam.lon], Math.max(map.getZoom(), 15), { duration: 0.8 });
            // Se ao chegar a câmera ainda estiver dentro de um cluster, aproxima
            // (ou abre o leque) até ela aparecer
            map.once('moveend', () => {
                if (selected === entry && clusters.hasLayer(entry.marker) && !map.hasLayer(entry.marker)) {
                    clusters.zoomToShowLayer(entry.marker);
                }
            });
        }

        // Restaura o marcador e encerra o player da câmera selecionada
        function deselect() {
            if (!selected) return;
            selected.marker.setStyle(markerStyle(selected, false));
            clearCameraTimeouts(selected.cam.cameraId);
            stopPlayer(selected.cam.cameraId);
            selected = null;
        }

        function closeSelection() {
            deselect();
            if (!popupEl.hidden) {
                popupEl.hidden = true;
                popupEl.innerHTML = '';
            }
            if (!mPanel.hidden) {
                mPanel.hidden = true;
                mPanel.innerHTML = '';
                mHint.hidden = false;
                document.body.classList.remove('has-selection');
                map.invalidateSize({ pan: false });
            }
        }

        function openPopup(entry, fly) {
            const { cam } = entry;
            popupEl.innerHTML = `
                <div class="cp-head">
                    <div class="cp-headtext">
                        ${metaHtml(cam)}
                        <div class="cp-title">${esc(cam.titulo)}</div>
                    </div>
                    <button type="button" class="cp-close" data-action="close" aria-label="Fechar">×</button>
                </div>
                <div id="camera-content-${cam.cameraId}" class="feed cp-feed"></div>
                <div class="cp-actions">
                    <button type="button" class="btn-primary" data-action="pin"></button>
                    <a class="btn-secondary" href="${cam.pageUrl}" target="_blank" rel="noopener">Abrir em nova aba ${ICON.external}</a>
                </div>
            `;
            popupEl.querySelector('[data-action="close"]').addEventListener('click', closeSelection);
            popupEl.querySelector('[data-action="pin"]').addEventListener('click', () => {
                if (pinned.has(cam.cameraId)) {
                    unpinCamera(cam.cameraId);
                } else {
                    // Fecha o popup antes, para não abrir 2 streams da mesma câmera
                    closeSelection();
                    pinCamera(cam);
                }
            });
            popupEl.hidden = false;
            updatePopupPinLabel();
            positionPopup();
            if (fly) flyToCamera(entry);
            loadCameraContent(cam, cam.cameraId, { isStale: () => selected !== entry });
        }

        function updatePopupPinLabel() {
            const btn = selected && !popupEl.hidden ? popupEl.querySelector('[data-action="pin"]') : null;
            if (btn) btn.innerHTML = pinned.has(selected.cam.cameraId) ? `Fixada ${ICON.check}` : 'Fixar no painel';
        }

        // Acima do marcador se couber; senão abaixo; senão ao lado. Some enquanto o
        // marcador estiver fora da área visível do mapa.
        function positionPopup() {
            if (!selected || popupEl.hidden) return;
            const mw = mapWrap.clientWidth, mh = mapWrap.clientHeight;
            const W = popupEl.offsetWidth, H = popupEl.offsetHeight;
            // Posição atual do marcador (no leque do cluster ela muda)
            const p = map.latLngToContainerPoint(selected.marker.getLatLng());
            popupEl.style.visibility = (p.x < 0 || p.y < 0 || p.x > mw || p.y > mh) ? 'hidden' : '';

            let left = Math.min(Math.max(p.x - W / 2, 12), mw - W - 12);
            let top;
            if (p.y - 16 >= H) {
                top = p.y - 16 - H;
            } else if (mh - p.y - 16 >= H) {
                top = p.y + 16;
            } else {
                top = Math.max(12, Math.min(p.y - H / 2, mh - H - 12));
                left = p.x + 20 + W <= mw - 12 ? p.x + 20 : Math.max(12, p.x - 20 - W);
            }
            popupEl.style.left = left + 'px';
            popupEl.style.top = top + 'px';
        }

        map.on('move zoom resize', positionPopup);

        function openMobilePanel(entry, fly) {
            const { cam } = entry;
            mPanel.innerHTML = `
                <div class="m-head">
                    <div class="m-headtext">
                        ${metaHtml(cam)}
                        <div class="m-title">${esc(cam.titulo)}</div>
                    </div>
                    <div class="m-actions">
                        <a class="m-open" href="${cam.pageUrl}" target="_blank" rel="noopener" title="Abrir em tela cheia" aria-label="Abrir em tela cheia">${ICON.expand}</a>
                        <button type="button" class="m-close" data-action="close" aria-label="Fechar">×</button>
                    </div>
                </div>
                <div id="camera-content-${cam.cameraId}" class="feed m-feed"></div>
            `;
            mPanel.querySelector('[data-action="close"]').addEventListener('click', closeSelection);
            mPanel.hidden = false;
            mHint.hidden = true;
            document.body.classList.add('has-selection');
            // O mapa encolhe: recalcula e traz a câmera para a área que sobrou
            // (sempre, pois a altura do painel varia com o tamanho do título)
            map.invalidateSize({ pan: false });
            if (fly) flyToCamera(entry);
            else map.panTo(entry.marker.getLatLng(), { animate: true });
            loadCameraContent(cam, cam.cameraId, { isStale: () => selected !== entry });
        }

        // Toque/clique no mapa vazio fecha a busca e a câmera aberta
        map.on('click', () => {
            closeSearch();
            closeSelection();
        });

        // ============================================================
        //  Câmeras fixadas (desktop) — salvas no navegador
        // ============================================================
        const PINS_KEY = 'riocameras.pinned';
        const PIN_COLS_KEY = 'riocameras.pinCols';
        const pinned = new Map(); // cameraId -> cam, na ordem em que foram fixadas
        const pinList = document.getElementById('pin-list');
        const pinEmpty = document.getElementById('pin-empty');
        const pinColsBtn = document.getElementById('pin-cols');

        function pinsChanged() {
            document.getElementById('pin-count').textContent = pinned.size;
            pinEmpty.hidden = pinned.size > 0;
            storage.set(PINS_KEY, JSON.stringify([...pinned.keys()]));
            updatePopupPinLabel();
        }

        function pinCamera(cam, { restoring = false } = {}) {
            let card = document.getElementById(`pin-card-${cam.cameraId}`);
            if (!card) {
                const key = 'pin-' + cam.cameraId;
                card = document.createElement('div');
                card.className = 'pin-card';
                card.id = `pin-card-${cam.cameraId}`;
                card.innerHTML = `
                    <div id="camera-content-${key}" class="feed"></div>
                    <div class="pin-foot">
                        <button type="button" class="pin-name" title="Ver no mapa">
                            <span class="pin-name-t">${esc(cam.titulo)}</span>
                            <span class="pin-meta">${esc([`#${cam.cameraId}`, cam.bairro].filter(Boolean).join(' · '))}</span>
                        </button>
                        <button type="button" class="pin-x" title="Desafixar" aria-label="Desafixar">×</button>
                    </div>
                `;
                card.querySelector('.pin-name').addEventListener('click', () => {
                    const entry = camById.get(cam.cameraId);
                    if (entry) selectCamera(entry, { fly: true });
                });
                card.querySelector('.pin-x').addEventListener('click', () => unpinCamera(cam.cameraId));
                pinList.appendChild(card);
                pinned.set(cam.cameraId, cam);
                pinsChanged();
                // No mobile o painel não aparece: o player só sobe no desktop
                if (!isMobileUi()) loadCameraContent(cam, key, { showOpenLink: true });
            }
            if (restoring) return;

            // Mostra (e destaca) o card, inclusive se a câmera já estava fixada
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            card.classList.remove('is-flash');
            void card.offsetWidth; // reinicia a animação
            card.classList.add('is-flash');
        }

        function unpinCamera(cameraId) {
            const key = 'pin-' + cameraId;
            clearCameraTimeouts(key);
            stopPlayer(key);
            const card = document.getElementById(`pin-card-${cameraId}`);
            if (card) card.remove();
            pinned.delete(cameraId);
            pinsChanged();
        }

        // Liga os players das fixadas no desktop e desliga no mobile
        function syncPinPlayers() {
            pinned.forEach((cam, cameraId) => {
                const key = 'pin-' + cameraId;
                if (isMobileUi()) {
                    clearCameraTimeouts(key);
                    stopPlayer(key);
                    const feed = document.getElementById(`camera-content-${key}`);
                    if (feed) { feed.classList.remove('is-playing'); feed.innerHTML = ''; }
                } else if (!activePlayers[key]) {
                    loadCameraContent(cam, key, { showOpenLink: true });
                }
            });
        }

        function setPinCols(n) {
            pinList.classList.toggle('cols-2', n === 2);
            pinColsBtn.setAttribute('aria-pressed', String(n === 2));
            pinColsBtn.title = n === 2 ? 'Mostrar em 1 coluna' : 'Mostrar em 2 colunas';
            storage.set(PIN_COLS_KEY, String(n));
        }

        setPinCols(storage.get(PIN_COLS_KEY) === '2' ? 2 : 1);
        pinColsBtn.addEventListener('click', () => setPinCols(pinList.classList.contains('cols-2') ? 1 : 2));
        document.getElementById('pin-clear').addEventListener('click', () => {
            [...pinned.keys()].forEach(unpinCamera);
        });

        // ============================================================
        //  Busca (ruas/câmeras por nome ou ID, e bairros)
        // ============================================================
        const searchEl = document.getElementById('search');
        const searchInput = document.getElementById('search-input');
        const searchDropdown = document.getElementById('search-dropdown');
        let bairroIndex = []; // { nome, lat, lon, key }
        let searchFirst = null; // ação do Enter (primeiro resultado)

        function renderSearch() {
            const raw = searchInput.value.trim();
            const q = norm(raw);
            const tokens = q.split(/\s+/).filter(Boolean);
            const matches = (key) => tokens.every(t => key.includes(t));

            // Sem busca, lista todos os bairros como atalho
            const bairros = tokens.length ? bairroIndex.filter(b => matches(b.key)).slice(0, 6) : bairroIndex;

            let cams = [];
            if (tokens.length) {
                const exactId = /^\d+$/.test(q) ? q.padStart(6, '0') : null;
                for (const entry of camById.values()) {
                    if (!matches(entry.key)) continue;
                    // ID exato primeiro, depois nomes que começam com a busca
                    const rank = entry.cam.cameraId === exactId ? 0 : (entry.nameKey.startsWith(q) ? 1 : 2);
                    cams.push({ entry, rank });
                }
                cams = cams.sort((a, b) => a.rank - b.rank).slice(0, 6).map(x => x.entry);
            }

            let html = '';
            if (bairros.length) {
                html += '<div class="sd-label">Bairros</div><div class="sd-chips">' +
                    bairros.map(b => `<button type="button" class="sd-chip" data-bairro="${b.idx}">${esc(b.nome)}</button>`).join('') +
                    '</div>';
            }
            if (cams.length) {
                // Muitas câmeras têm o mesmo nome: nesses casos mostra o ID para diferenciar
                const sameName = {};
                cams.forEach(e => { sameName[e.cam.titulo] = (sameName[e.cam.titulo] || 0) + 1; });
                html += '<div class="sd-label">Câmeras</div><div class="sd-rows">' +
                    cams.map(e => `
                        <button type="button" class="sd-row" data-cam="${esc(e.cam.cameraId)}">
                            <span class="sd-dot" style="background:${markerColor(e)}"></span>
                            <span class="sd-text">
                                <span class="sd-name">${esc(e.cam.titulo)}</span>
                                <span class="sd-bairro">${esc([sameName[e.cam.titulo] > 1 ? `#${e.cam.cameraId}` : '', e.cam.bairro].filter(Boolean).join(' · '))}</span>
                            </span>
                        </button>`).join('') +
                    '</div>';
            }
            if (!html) html = `<div class="sd-empty">Nada encontrado para “${esc(raw)}”</div>`;
            searchDropdown.innerHTML = html;
            searchDropdown.hidden = false;

            searchFirst = cams.length ? () => pickCamera(cams[0])
                : (tokens.length && bairros.length ? () => pickBairro(bairros[0]) : null);
        }

        function closeSearch() {
            searchDropdown.hidden = true;
        }

        // No celular a caixa fica ao lado do logo: placeholder mais curto
        function updateSearchPlaceholder() {
            searchInput.placeholder = isMobileUi() ? 'Buscar rua ou bairro' : 'Buscar rua, câmera ou bairro';
        }
        updateSearchPlaceholder();

        function clearSearch() {
            searchInput.value = '';
            closeSearch();
            searchInput.blur();
        }

        function pickCamera(entry) {
            clearSearch();
            selectCamera(entry, { fly: true });
        }

        function pickBairro(b) {
            clearSearch();
            map.flyTo([b.lat, b.lon], 14, { duration: 0.8 });
        }

        searchInput.addEventListener('focus', renderSearch);
        searchInput.addEventListener('input', renderSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && searchFirst) {
                e.preventDefault();
                searchFirst();
            }
        });
        searchDropdown.addEventListener('click', (e) => {
            const camBtn = e.target.closest('[data-cam]');
            const bairroBtn = e.target.closest('[data-bairro]');
            if (camBtn) {
