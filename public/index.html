                const entry = camById.get(camBtn.dataset.cam);
                if (entry) pickCamera(entry);
            } else if (bairroBtn) {
                pickBairro(bairroIndex[+bairroBtn.dataset.bairro]);
            }
        });
        document.addEventListener('pointerdown', (e) => {
            if (!searchEl.contains(e.target)) closeSearch();
        });

        // "/" foca a busca; Esc fecha a busca e a câmera aberta
        document.addEventListener('keydown', (e) => {
            const el = document.activeElement;
            const typing = el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable);
            if (e.key === '/' && !typing) {
                e.preventDefault();
                searchInput.focus();
            } else if (e.key === 'Escape') {
                closeSearch();
                if (el === searchInput) searchInput.blur();
                closeSelection();
            }
        });

        // Ao cruzar o breakpoint, troca popup <-> painel do mobile e liga/desliga as fixadas
        const onBreakpoint = () => {
            closeSelection();
            syncPinPlayers();
            updateSearchPlaceholder();
            map.invalidateSize();
        };
        if (MOBILE_MQ.addEventListener) MOBILE_MQ.addEventListener('change', onBreakpoint);
        else MOBILE_MQ.addListener(onBreakpoint);

        // Encerra as sessões abertas ao sair da página.
        window.addEventListener('beforeunload', () => {
            Object.keys(activePlayers).forEach(stopPlayer);
        });

        // ---- Aviso de carregamento (passo atual / erro com "Tentar novamente") ----
        const loadingEl = document.getElementById('loading');

        function setLoading(title, step) {
            document.getElementById('loading-title').textContent = title;
            document.getElementById('loading-step').textContent = step;
        }

        function finishLoading() {
            loadingEl.classList.add('is-done');
            setTimeout(() => { loadingEl.hidden = true; }, 300);
            // Só faz sentido pedir para tocar numa câmera depois que elas aparecem
            mHint.hidden = !!selected;
        }

        // Mensagem para o visitante (o detalhe técnico vai para o console)
        function loadErrorText(error) {
            if (error.name === 'AbortError') return 'O servidor demorou demais para responder.';
            if (/^HTTP \d+/.test(error.message)) return `O servidor respondeu com erro (${error.message}).`;
            if (error instanceof SyntaxError) return 'A lista de câmeras veio num formato inesperado.';
            return 'Não foi possível conectar ao servidor.';
        }

        document.getElementById('loading-retry').addEventListener('click', () => {
            loadingEl.classList.remove('is-error');
            document.getElementById('camera-count').textContent = 'Carregando…';
            boot();
        });

        // Carrega a lista (estática ou via proxy) e monta o mapa.
        async function boot() {
            setLoading('Carregando câmeras', 'Buscando a lista de câmeras…');
            // A lista vem do COR (via proxy) e às vezes demora: avisa e, no limite, desiste
            const ctrl = new AbortController();
            const slowTimer = setTimeout(() => setLoading('Carregando câmeras', 'O servidor do COR está demorando, aguarde…'), 8000);
            const abortTimer = setTimeout(() => ctrl.abort(), 45000);
            let list;
            try {
                const r = await fetch(CAMERAS_LIST, { signal: ctrl.signal });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                list = await r.json();
            } catch (error) {
                console.error('Erro ao carregar a lista de câmeras:', error);
                setLoading('Não foi possível carregar as câmeras', loadErrorText(error));
                loadingEl.classList.add('is-error');
                document.getElementById('camera-count').textContent = 'Erro ao carregar';
                return;
            } finally {
                clearTimeout(slowTimer);
                clearTimeout(abortTimer);
            }

            setLoading('Carregando câmeras', 'Verificando quais estão no ar…');

            // Avisa logo se o servidor de vídeo do COR estiver fora do ar.
            probeStreamServer();

            // Status das câmeras (online/offline). Se não carregar, tudo fica "não checada".
            const onlineSet = new Set(), offlineSet = new Set();
            let statusInfo = null;
            try {
                const sr = await fetch(STATUS_URL, { cache: 'no-cache' });
                if (sr.ok) {
                    statusInfo = await sr.json();
                    (statusInfo.online || []).forEach(id => onlineSet.add(id));
                    (statusInfo.offline || []).forEach(id => offlineSet.add(id));
                }
            } catch (e) { /* sem status: marcadores no padrão */ }
            const hasStatus = !!(statusInfo && (onlineSet.size || offlineSet.size));

            // O bairros-rj.json veio de geocodificação: descarta pontos fora do
            // município e coordenadas repetidas (fallback do geocodificador, que
            // jogaria câmeras do Catumbi em "Anchieta", por exemplo).
            const rawBairros = ((await bairrosReady) || [])
                .map(b => ({ nome: b.nome, lat: parseFloat(b.latitude), lon: parseFloat(b.longitude) }))
                .filter(b => b.nome && b.lat > -23.09 && b.lat < -22.74 && b.lon > -43.80 && b.lon < -43.09);
            const coordCount = {};
            rawBairros.forEach(b => { const k = b.lat + ',' + b.lon; coordCount[k] = (coordCount[k] || 0) + 1; });
            const bairroList = rawBairros
                .filter(b => coordCount[b.lat + ',' + b.lon] === 1)
                .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
            bairroList.forEach((b, i) => { b.idx = i; b.key = norm(b.nome); });
            bairroIndex = bairroList;

            // O COR às vezes lista a mesma câmera duas vezes ("004227" e "4227"): fica a 1ª
            const seenIds = new Set();
            const cameras = (Array.isArray(list) ? list : (list.cameras || [])).map(normalizeCamera)
                .filter(cam => !seenIds.has(cam.cameraId) && seenIds.add(cam.cameraId));

            // Deixa o passo aparecer na tela antes do trabalho pesado (milhares de marcadores)
            setLoading('Carregando câmeras', `Montando o mapa com ${fmt(cameras.length)} câmeras…`);
            await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));

            // Marcadores separados por tipo x status ("brt:online", ...): os filtros
            // entram/saem do cluster em lote, bem mais rápido que um a um.
            const markerGroups = {};
            ['brt', 'other'].forEach(t => ['online', 'offline', 'unknown'].forEach(s => {
                markerGroups[t + ':' + s] = [];
            }));

            cameras.forEach(cam => {
                if (isNaN(cam.lat) || isNaN(cam.lon)) return;

                const type = cam.brt ? 'brt' : 'other';
                const status = onlineSet.has(cam.cameraId) ? 'online'
                    : (offlineSet.has(cam.cameraId) ? 'offline' : 'unknown');
                cam.status = status;
                cam.bairro = nearestBairro(cam.lat, cam.lon, bairroList);

                const entry = { cam, type, status, key: norm(`${cam.cameraId} ${cam.nome}`), nameKey: norm(cam.titulo) };
                // bubblingMouseEvents: false -> o clique no marcador não chega no mapa (que fecharia o popup)
                entry.marker = L.circleMarker([cam.lat, cam.lon], { ...markerStyle(entry, false), bubblingMouseEvents: false });
                entry.marker.entry = entry; // usado no ícone do cluster
                entry.marker.on('click', () => selectCamera(entry));
                markerGroups[type + ':' + status].push(entry.marker);
                camById.set(cam.cameraId, entry);
            });

            console.log(`${cameras.length} câmeras carregadas no mapa`);

            // ---- Filtros, contadores e status no header -------------------------
            const filters = {
                type: { brt: true, other: true },
                status: { online: true, offline: true, unknown: true }
            };
            const groupSize = {};
            Object.keys(markerGroups).forEach(k => { groupSize[k] = markerGroups[k].length; });
            // Soma os marcadores dos grupos (tipo, status) que passam no predicado
            const countWhere = (pred) => Object.keys(groupSize).reduce((n, k) => {
                const [t, s] = k.split(':');
                return pred(t, s) ? n + groupSize[k] : n;
            }, 0);
            const isVisible = (t, s) => filters.type[t] && filters.status[s];

            document.getElementById('camera-count').textContent = `${fmt(countWhere(() => true))} câmeras`;
            if (hasStatus) {
                const pills = document.getElementById('status-pills');
                document.getElementById('pill-live').textContent = `${fmt(countWhere((t, s) => s === 'online'))} ao vivo`;
                document.getElementById('pill-off').textContent = `${fmt(countWhere((t, s) => s === 'offline'))} fora do ar`;
                if (statusInfo.generatedAt) pills.title = 'Status checado em ' + new Date(statusInfo.generatedAt).toLocaleString('pt-BR');
                pills.hidden = false;
            }

            // Sem status.json não há o que filtrar por status: só os chips de tipo.
            // A bolinha de cada chip mostra a cor dos pontos que ele controla
            // ("Ao vivo" pega os dois tipos: bolinha verde + azul).
            const chipDefs = [
                ...(hasStatus ? [
                    { group: 'status', value: 'online', label: 'Ao vivo', duo: [COLOR.online, COLOR.brt] },
                    { group: 'status', value: 'offline', label: 'Fora do ar', swatch: COLOR.offline, ring: COLOR.offline }
                ] : []),
                { group: 'type', value: 'brt', label: 'BRT', swatch: COLOR.brt, ring: COLOR.brt },
                { group: 'type', value: 'other', label: 'Demais', swatch: COLOR.online, ring: COLOR.online }
            ];
            const chipsEl = document.getElementById('filter-chips');
            chipsEl.innerHTML = chipDefs.map((c, i) => `
                <button type="button" class="chip" data-chip="${i}" aria-pressed="true" style="--swatch:${c.swatch};--ring:${c.ring}">
                    ${c.duo
                        ? `<span class="chip-duo">${c.duo.map(color => `<i style="--c:${color}"></i>`).join('')}</span>`
                        : '<span class="chip-swatch"></span>'}<span class="chip-label">${c.label}</span><span class="chip-count"></span>
                </button>`).join('');
            const chipEls = [...chipsEl.querySelectorAll('.chip')];

            const groupOn = {}; // grupo já está no cluster?
            const applyFilters = () => {
                let add = [], remove = [];
                Object.keys(markerGroups).forEach(k => {
                    const [t, s] = k.split(':');
                    const want = isVisible(t, s);
                    if (want && !groupOn[k]) add = add.concat(markerGroups[k]);
                    else if (!want && groupOn[k]) remove = remove.concat(markerGroups[k]);
                    groupOn[k] = want;
                });
                if (remove.length) clusters.removeLayers(remove);
                if (add.length) clusters.addLayers(add);
                // A câmera aberta foi escondida pelo filtro: fecha
                if (selected && !isVisible(selected.type, selected.status)) closeSelection();

                // Contagem de cada chip considerando o que está ligado no outro filtro
                chipDefs.forEach((c, i) => {
                    chipEls[i].setAttribute('aria-pressed', String(filters[c.group][c.value]));
                    chipEls[i].querySelector('.chip-count').textContent = fmt(c.group === 'type'
                        ? countWhere((t, s) => t === c.value && filters.status[s])
                        : countWhere((t, s) => s === c.value && filters.type[t]));
                });
            };
            chipsEl.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-chip]');
                if (!btn) return;
                const c = chipDefs[+btn.dataset.chip];
                filters[c.group][c.value] = !filters[c.group][c.value];
                applyFilters();
            });
            applyFilters();
            finishLoading();

            // ---- Restaura as fixadas da última visita ---------------------------
            let saved = [];
            try { saved = JSON.parse(storage.get(PINS_KEY) || '[]'); } catch (e) { }
            if (Array.isArray(saved)) {
                saved.forEach(id => {
                    const entry = camById.get(String(id));
                    if (entry) pinCamera(entry.cam, { restoring: true });
                });
            }
        }

        boot();
    </script>
</body>
